name: Inline source qualification

on:
  push:
    branches: [codex/inline-source-ci]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "2"
  GOFLAGS: -p=2
  GOMEMLIMIT: 3GiB

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 94cbb738f97e970208b9f9652b438dec256a679c
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify source, test-only scope and formatting
        run: |
          test "$(git rev-parse HEAD)" = "94cbb738f97e970208b9f9652b438dec256a679c"
          test "$(git diff --name-only dbd10c80eb3fa682a796fffa12e663bd4a4634c4 HEAD)" = "internal/inline/importer_test.go"
          test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Resume checkpoint compatibility regression
        run: go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline -run '^TestLoadSyncStateRejectsForeignAccountAndMalformedCursor$'
      - name: Lint
        run: make lint-ci
