name: Inline source qualification
on:
  push:
    branches: [codex/inline-source-ci]
permissions:
  contents: read
env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "4"
  GOFLAGS: -p=4
  GOMEMLIMIT: 6GiB
  MSGVAULT_TEST_DB: ""
jobs:
  generator:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 5b07272f9793a1b59546c756f09784056d07f43f
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify current-base source
        run: |
          test "$(git rev-parse HEAD)" = "5b07272f9793a1b59546c756f09784056d07f43f"
          test "$(git rev-parse HEAD^{tree})" = "5c3ada3397e84f81c05b3bdcfc94064adde10088"
      - name: Regenerate OpenAPI with updated tool dependencies
        run: make openapi-check
      - name: Generated-client and normalizer behavior
        run: |
          go test -timeout 15m -tags "fts5 sqlite_vec" -count=1 ./internal/codegenfix ./pkg/client
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
