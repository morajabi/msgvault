name: Inline source qualification

on:
  push:
    branches: [codex/inline-source-ci]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "2"
  GOFLAGS: -p=2
  GOMEMLIMIT: 3GiB
  MSGVAULT_TEST_DB: ""

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c1a4aa4f69276bb7ffc2f3cec22a64f310f2aba3
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify source and formatting
        run: |
          test "$(git rev-parse HEAD)" = "c1a4aa4f69276bb7ffc2f3cec22a64f310f2aba3"
          go fmt ./...
          git diff --exit-code
      - name: Prove omitted reaction snapshots before the fix
        shell: bash
        run: |
          set -euo pipefail
          cp internal/inline/mcp.go "$RUNNER_TEMP/mcp.go"
          git show 6da1aebe69f179a94e12933eb8b98ace7e37f1de:internal/inline/mcp.go > internal/inline/mcp.go
          if go test -tags "fts5 sqlite_vec" -count=1 -v ./internal/inline -run '^TestMCPImportPersistsAndReplacesReactionSnapshots$' > "$RUNNER_TEMP/reactions.log" 2>&1; then
            cat "$RUNNER_TEMP/reactions.log"
            echo "Expected reaction normalization regression was not reproduced"
            exit 1
          fi
          grep -q '^--- FAIL: TestMCPImportPersistsAndReplacesReactionSnapshots' "$RUNNER_TEMP/reactions.log"
          cat "$RUNNER_TEMP/reactions.log"
          cp "$RUNNER_TEMP/mcp.go" internal/inline/mcp.go
          git diff --exit-code
      - name: Provider, config and CLI contracts
        run: go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline ./internal/config ./internal/clirun
      - name: Daemon and store integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run 'Inline|ManualSync|PurgeExcludedMedia'
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/api -run 'Inline|CLIRunCommandAllowed|Settings'
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/store -run 'Reaction|Inline|CommunicationService|ParticipantIdentifier'
      - name: Vet
        run: go vet -tags "fts5 sqlite_vec" ./...
      - name: Lint
        run: make lint-ci

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c1a4aa4f69276bb7ffc2f3cec22a64f310f2aba3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: PostgreSQL provider and reaction persistence
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/store -run 'Reaction|Inline'

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c1a4aa4f69276bb7ffc2f3cec22a64f310f2aba3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: web/package.json
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Browser labels and type checks
        run: |
          make web-install web-check
          cd web
          bun run test src/lib/sources/labels.test.ts src/lib/explore/labels.test.ts
      - name: Build executable and embedded assets
        run: |
          make build
          node scripts/check-web-assets.mjs --binary ./msgvault
          ./msgvault version
          ./msgvault add-inline --help
          ./msgvault sync-inline --help
          ./msgvault backfill-inline-media --help
          git diff --exit-code

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: c1a4aa4f69276bb7ffc2f3cec22a64f310f2aba3
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Read public docs assets from upstream
        run: git remote set-url origin https://github.com/kenn-io/msgvault.git
      - name: Install docs dependencies
        working-directory: docs
        run: uv sync --frozen --no-dev
      - name: Build and validate documentation
        run: make docs-check
