name: Inline source qualification

on:
  push:
    branches: [codex/inline-source-ci]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "4"
  GOFLAGS: -p=4
  GOMEMLIMIT: 6GiB
  MSGVAULT_TEST_DB: ""

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: a0c9014e86939737da07723bfaf2db91bf8638c5
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify source and formatting
        run: |
          test "$(git rev-parse HEAD)" = "a0c9014e86939737da07723bfaf2db91bf8638c5"
          go fmt ./...
          git diff --exit-code
      - name: Rendered root help contract
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run "^TestRootHelpGolden$" -args -update
          git diff --exit-code
      - name: Provider and scheduler integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline ./internal/chatwoot ./internal/config ./internal/clirun ./internal/scheduler ./internal/operations ./internal/meetingarchive ./internal/meetingcontent ./internal/netguard ./internal/remoteimage ./internal/carddav ./internal/discord ./internal/envutil ./internal/muesli ./internal/personmatch
      - name: CLI and daemon integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run 'Inline|Chatwoot|ManualSync|PurgeExcludedMedia|Help|GroupCommand|CacheRefresh|CacheBuildJobs|MCP|Meeting|ShowMessage|AttachmentMaintenance'
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/api ./internal/daemonclient
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/mcp
      - name: Store schema and maintenance integration
        run: |
          go test -timeout 30m -tags "fts5 sqlite_vec" -count=1 ./internal/store -run 'SchemaVersion|Inline|Chatwoot|Reaction|CommunicationService|ParticipantIdentifier|Attachment|Sync|PersonSweep|Exclusive|Maintenance|Attribution|Recipient|StoredMessage|RelatedMessage|Observation'
      - name: Explore and filename query integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/query ./internal/identityindex
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/tui -run "Meeting|Conversation|Transcript"
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/vector -run "Config|Policy|Person"
      - name: Vet
        run: |
          go vet -tags "fts5 sqlite_vec" ./...
      - name: Lint
        run: |
          make lint-ci

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: a0c9014e86939737da07723bfaf2db91bf8638c5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: PostgreSQL provider and scheduler integration
        run: |
          test "$(git rev-parse HEAD)" = "a0c9014e86939737da07723bfaf2db91bf8638c5"
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline ./internal/chatwoot ./internal/scheduler ./internal/operations ./internal/meetingarchive ./internal/meetingcontent
      - name: PostgreSQL CLI and API integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run 'Inline|Chatwoot|ManualSync|PurgeExcludedMedia|Help|GroupCommand|CacheRefresh|CacheBuildJobs|MCP|Meeting|ShowMessage|AttachmentMaintenance'
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/api ./internal/daemonclient
      - name: PostgreSQL schema and maintenance integration
        run: |
          go test -timeout 30m -tags "fts5 sqlite_vec" -count=1 ./internal/store -run 'SchemaVersion|Inline|Chatwoot|Reaction|CommunicationService|ParticipantIdentifier|Attachment|Sync|PersonSweep|Exclusive|Maintenance|Attribution|Recipient|StoredMessage|RelatedMessage|Observation'
          git diff --exit-code

  build:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: a0c9014e86939737da07723bfaf2db91bf8638c5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: web/package.json
      - name: Install container build tools
        run: |
          rm -f /etc/apt/sources.list.d/nodesource.list
          for attempt in 1 2 3; do
            if apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30 && apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=30 gcc g++ make unzip libsqlite3-dev; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying" >&2
            sleep 30
          done
          exit 1
      - name: Trust container checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Browser labels and type checks
        run: |
          make web-install web-check web-test
      - name: Precompile real archive fixture
        run: go test -tags "fts5 sqlite_vec" -run "^$" -count=1 ./internal/query
      - name: Build executable and embedded assets
        run: |
          make build
          node scripts/check-web-assets.mjs --binary ./msgvault
          ./msgvault version
          ./msgvault add-inline --help
          ./msgvault sync-inline --help
          ./msgvault backfill-inline-media --help
          make test-cli-e2e MSGVAULT_E2E_BINARY="$PWD/msgvault"
          git diff --exit-code

      - name: Real daemon conversation and meeting browser integration
        working-directory: web
        run: bun run test:browser tests/e2e/chatwoot-links.spec.ts tests/e2e/meeting-intelligence.spec.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: chatwoot-integration-browser-failures
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: a0c9014e86939737da07723bfaf2db91bf8638c5
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Read public docs assets from upstream
        run: git remote set-url origin https://github.com/kenn-io/msgvault.git
      - name: Install docs dependencies
        working-directory: docs
        run: uv sync --frozen --no-dev
      - name: Build and validate documentation
        run: make docs-check

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: a0c9014e86939737da07723bfaf2db91bf8638c5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite development headers
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows Inline provider and config behavior
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          if ((git rev-parse HEAD) -ne "a0c9014e86939737da07723bfaf2db91bf8638c5") { throw "unexpected qualification source" }
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline ./internal/config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
