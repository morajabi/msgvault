name: Inline source qualification

on:
  push:
    branches: [codex/inline-source-ci]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "4"
  GOFLAGS: -p=4
  GOMEMLIMIT: 6GiB
  MSGVAULT_TEST_DB: ""

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: cabfdbbfe952e692214e6aba96024c2b6a689d04
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify source and formatting
        run: |
          test "$(git rev-parse HEAD)" = "cabfdbbfe952e692214e6aba96024c2b6a689d04"
          go fmt ./...
          git diff --exit-code
      - name: Combined provider purge fixture behavior
        run: go test -v -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run "PurgeExcludedMedia|MediaPolicy|SweepAttachment|SweepUnreferenced"
      - name: Vet
        run: |
          go vet -tags "fts5 sqlite_vec" ./...
      - name: Lint
        run: |
          make lint-ci

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: cabfdbbfe952e692214e6aba96024c2b6a689d04
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: PostgreSQL combined provider purge fixture behavior
        run: go test -v -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run "PurgeExcludedMedia|MediaPolicy|SweepAttachment|SweepUnreferenced"
