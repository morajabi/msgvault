name: Inline source qualification

on:
  push:
    branches: [codex/inline-source-ci]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "2"
  GOFLAGS: -p=2
  GOMEMLIMIT: 3GiB

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 36d0796bc292302bfce84790568f7bab72982030
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify source, scope and formatting
        run: |
          test "$(git rev-parse HEAD)" = "36d0796bc292302bfce84790568f7bab72982030"
          test "$(git diff --name-only 9cfc996e5cdc55b2808eea70744564ee27132490 HEAD)" = "internal/inline/media_test.go"
          test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Media statistics and terminal retry regression
        run: go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline -run '^TestMediaImportPersistsAttachmentStatsForListingsAndSearch$'
