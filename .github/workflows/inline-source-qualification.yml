name: Inline source qualification

on:
  push:
    branches: [codex/inline-source-ci]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "2"
  GOFLAGS: -p=2
  GOMEMLIMIT: 3GiB

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0f0c057959fb3bc4da25ef666b2114fc2e28afe3
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify source and formatting
        run: |
          test "$(git rev-parse HEAD)" = "0f0c057959fb3bc4da25ef666b2114fc2e28afe3"
          test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Prove unfinished history starvation before the fix
        shell: bash
        run: |
          set -euo pipefail
          cp internal/inline/importer.go "$RUNNER_TEMP/importer.go"
          git show 94cbb738f97e970208b9f9652b438dec256a679c:internal/inline/importer.go > internal/inline/importer.go
          if go test -tags "fts5 sqlite_vec" -count=1 -v ./internal/inline -run '^TestLimitedImportFinishesHistoryDespiteOngoingArrivals$' > "$RUNNER_TEMP/history-starvation.log" 2>&1; then
            cat "$RUNNER_TEMP/history-starvation.log"
            echo "Expected history-starvation regression was not reproduced"
            exit 1
          fi
          grep -q '^--- FAIL: TestLimitedImportFinishesHistoryDespiteOngoingArrivals' "$RUNNER_TEMP/history-starvation.log"
          echo "Reproduced within-chat history starvation"
          cp "$RUNNER_TEMP/importer.go" internal/inline/importer.go
          git diff --exit-code
      - name: Full Inline provider regressions
        run: go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline
      - name: Vet changed provider
        run: go vet -tags "fts5 sqlite_vec" ./internal/inline
      - name: Lint
        run: make lint-ci
