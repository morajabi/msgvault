name: Inline source qualification

on:
  push:
    branches: [codex/inline-source-ci]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "4"
  GOFLAGS: -p=4
  GOMEMLIMIT: 6GiB
  MSGVAULT_TEST_DB: ""

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: d67f64291c50f8cf6f9d72931b8d9874ea5fc689
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify source and formatting
        run: |
          test "$(git rev-parse HEAD)" = "d67f64291c50f8cf6f9d72931b8d9874ea5fc689"
          go fmt ./...
          git diff --exit-code
      - name: Rendered root help contract
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run "^TestRootHelpGolden$" -args -update
          git diff --exit-code
      - name: Provider and scheduler integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline ./internal/config ./internal/clirun ./internal/scheduler ./internal/operations
      - name: CLI and daemon integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run 'Inline|ManualSync|PurgeExcludedMedia|Help|GroupCommand|CacheRefresh|DaemonGmailClient|MessageTags|MCP|FilenameDiscovery|Emlx|Activity'
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/api -run 'Inline|CLIRunCommandAllowed|Settings|EmailTags|MCPCapabilities|FileSuggestions|Idle|OperationGate'
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/mcp
      - name: Store schema and maintenance integration
        run: |
          go test -timeout 30m -tags "fts5 sqlite_vec" -count=1 ./internal/store -run 'SchemaVersion|Inline|Reaction|CommunicationService|ParticipantIdentifier|Attachment|Sync|PersonSweep|Exclusive|Maintenance|EmailTag|MicrosoftMailLabel|Emlx|Filename|Metadata|FTSDataRange'
      - name: Explore and filename query integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/query -run 'ExploreAttachmentByteEstimates|MetadataSearch|Filename|Mime'
      - name: Vet
        run: |
          go vet -tags "fts5 sqlite_vec" ./...
      - name: Lint
        run: |
          make lint-ci

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgvault_test
          POSTGRES_PASSWORD: msgvault_test
          POSTGRES_DB: msgvault_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSGVAULT_TEST_DB: postgres://msgvault_test:msgvault_test@localhost:5432/msgvault_test?sslmode=disable
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: d67f64291c50f8cf6f9d72931b8d9874ea5fc689
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: PostgreSQL provider and scheduler integration
        run: |
          test "$(git rev-parse HEAD)" = "d67f64291c50f8cf6f9d72931b8d9874ea5fc689"
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline ./internal/scheduler ./internal/operations
      - name: PostgreSQL CLI and API integration
        run: |
          go test -tags "fts5 sqlite_vec" -count=1 ./cmd/msgvault/cmd -run 'Inline|ManualSync|PurgeExcludedMedia|Help|GroupCommand|CacheRefresh|DaemonGmailClient|MessageTags|MCP|FilenameDiscovery|Emlx|Activity'
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/api -run 'Inline|CLIRunCommandAllowed|Settings|EmailTags|MCPCapabilities|FileSuggestions|Idle|OperationGate'
      - name: PostgreSQL schema and maintenance integration
        run: |
          go test -timeout 30m -tags "fts5 sqlite_vec" -count=1 ./internal/store -run 'SchemaVersion|Inline|Reaction|CommunicationService|ParticipantIdentifier|Attachment|Sync|PersonSweep|Exclusive|Maintenance|EmailTag|MicrosoftMailLabel|Emlx|Filename|Metadata|FTSDataRange'
          git diff --exit-code

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: d67f64291c50f8cf6f9d72931b8d9874ea5fc689
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: web/package.json
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Browser labels and type checks
        run: |
          make web-install web-check web-test
      - name: Build executable and embedded assets
        run: |
          make build
          node scripts/check-web-assets.mjs --binary ./msgvault
          ./msgvault version
          ./msgvault add-inline --help
          ./msgvault sync-inline --help
          ./msgvault backfill-inline-media --help
          make test-cli-e2e MSGVAULT_E2E_BINARY="$PWD/msgvault"
          git diff --exit-code

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: d67f64291c50f8cf6f9d72931b8d9874ea5fc689
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - name: Read public docs assets from upstream
        run: git remote set-url origin https://github.com/kenn-io/msgvault.git
      - name: Install docs dependencies
        working-directory: docs
        run: uv sync --frozen --no-dev
      - name: Build and validate documentation
        run: make docs-check

  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: d67f64291c50f8cf6f9d72931b8d9874ea5fc689
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite development headers
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed mingw-w64-x86_64-sqlite3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows Inline provider and config behavior
        shell: pwsh
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-IC:/msys64/mingw64/include -fgnu89-inline"
          CGO_LDFLAGS: "-Wl,--allow-multiple-definition"
        run: |
          if ((git rev-parse HEAD) -ne "d67f64291c50f8cf6f9d72931b8d9874ea5fc689") { throw "unexpected qualification source" }
          go test -tags "fts5 sqlite_vec" -count=1 ./internal/inline ./internal/config
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
