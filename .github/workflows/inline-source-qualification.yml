name: Inline source qualification

on:
  push:
    branches: [codex/inline-source-ci]

permissions:
  contents: read

env:
  GOPROXY: https://proxy.golang.org|direct
  GOMAXPROCS: "4"
  GOFLAGS: -p=4
  GOMEMLIMIT: 6GiB
  MSGVAULT_TEST_DB: ""

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ae36e3db510250ff6876d353702d67d885b7fce5
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Install SQLite headers
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Verify source and formatting
        run: |
          test "$(git rev-parse HEAD)" = "ae36e3db510250ff6876d353702d67d885b7fce5"
          go fmt ./...
          git diff --exit-code
      - name: Explore attachment estimates
        run: go test -v -tags "fts5 sqlite_vec" -count=1 ./internal/query -run '^TestExploreAttachmentByteEstimates$'
      - name: Vet
        run: go vet -tags "fts5 sqlite_vec" ./...
      - name: Lint
        run: make lint-ci

